<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swipe Keyboard Demo - Русская клавиатура</title>
  <link rel="stylesheet" href="../node_modules/simple-keyboard/build/css/index.css">
  <link rel="stylesheet" type="text/css" media="screen" href="main.css">
  <style>
    /* Сброс отступов для точного позиционирования */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    /* Основной контейнер: клавиатура + управление рядом */
    #root {
      display: flex;
      gap: 20px;
      padding: 10px;
    }
    
    /* Контейнер клавиатуры: фиксированный размер, без отступов */
    .keyboardContainer {
      width: 1080px;
      height: 631px;
      position: relative;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
    }
    
    /* Панель управления справа */
    .controlPanel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 300px;
      max-width: 400px;
    }
    
    .controlPanel input.input {
      width: 100%;
      font-size: 18px;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }
    
    .controlPanel button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      transition: background 0.2s;
    }
    
    #predictBtn {
      background: #2196F3;
      color: white;
    }
    
    #predictBtn:hover {
      background: #1976D2;
    }
    
    #predictionBlock {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      border: 2px solid #2196F3;
    }
    
    #predictionBlock .predicted {
      font-size: 20px;
      font-weight: bold;
      color: #2196F3;
      margin-bottom: 15px;
    }
    
    #predictionBlock input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 3px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    
    #predictionBlock .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    #acceptBtn {
      background: #4CAF50;
      color: white;
    }
    
    #acceptBtn:hover {
      background: #45a049;
    }
    
    #correctBtn {
      background: #2196F3;
      color: white;
    }
    
    #correctBtn:hover {
      background: #1976D2;
    }
    
    #cancelBtn {
      background: #f44336;
      color: white;
    }
    
    #cancelBtn:hover {
      background: #da190b;
    }
    
    /* Дополнительные стили для кастомных клавиш */
    .custom-keyboard-keys {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    
    .custom-key {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      box-shadow: 0 0 3px -1px rgba(0, 0, 0, .3);
      cursor: pointer;
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      pointer-events: auto;
      user-select: none;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      outline: none !important;
      line-height: normal !important;
      /* Размеры (width, height, left, top) задаются через JavaScript с !important */
    }
    
    .custom-key:active {
      background: #f0f0f0;
      box-shadow: 0 0 1px -1px rgba(0, 0, 0, .3);
    }
  </style>
</head>
<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>
  <div id="root">
    <!-- Клавиатура: строго 1080x631px, начинается с (0,0) относительно keyboardContainer -->
    <div class="keyboardContainer">
      <div class="simple-keyboard"></div>
    </div>
    
    <!-- Панель управления справа -->
    <div class="controlPanel">
      <input class="input" type="text" placeholder="Введите текст свайпом..." autocomplete="off" />
      
      <button id="predictBtn">
        Предсказать слово
      </button>
      
      <!-- Блок для подтверждения предсказания -->
      <div id="predictionBlock" style="display: none;">
        <div class="predicted">
          Предсказано: <span id="predictedWord"></span>
        </div>
        <label>
          Правильное слово:
          <input id="correctWord" type="text" placeholder="Введите правильное слово" />
        </label>
        <div class="buttons">
          <button id="acceptBtn">✓ Принять</button>
          <button id="correctBtn">✓ Сохранить исправленное</button>
          <button id="cancelBtn">✗ Отменить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../node_modules/simple-keyboard/build/index.js"></script>
  <script src="../build/index.js"></script>
  <script src="main.js"></script>
</body>
</html>
